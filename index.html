<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impacto Preciso</title>

    <!-- Cargamos Firebase para guardar el ranking -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        /* ==================== ESTILOS DEL JUEGO ==================== */
        
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #000000, #1a0000, #330000);
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        /* Texto grande de fondo */
        body::before {
            content: "IMPACTO PRECISO";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: rgba(255, 0, 0, 0.05);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
        }

        header {
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #ff1a1a;
            text-shadow: 0 0 15px red;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Tablero (Diana) */
        #board {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, red 20%, white 20%, white 40%, red 40%, red 60%, white 60%, white 80%, red 80%);
            position: relative;
            cursor: pointer;
            box-shadow: 0 0 30px red;
            transition: box-shadow 0.4s;
            overflow: hidden;
        }

        /* Efecto especial cuando das en el centro */
        #board.bullseye {
            box-shadow: 0 0 120px gold, 0 0 200px red;
        }

        #ranking {
            width: 260px;
            background: rgba(255, 0, 0, 0.1);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px red;
        }

        #ranking h3 {
            color: #ff3333;
        }

        input, select, button {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }

        button {
            cursor: pointer;
            background: #ff1a1a;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background: #cc0000;
        }

        .top1 {
            color: gold;
            font-weight: bold;
            font-size: 18px;
        }

        /* Pantalla de bienvenida */
        #welcomeScreen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #000000, #1a0000, #330000);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeIn 1s ease-in-out;
        }

        .game-logo {
            width: 140px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px red);
        }

        /* Texto que aparece cuando das en el blanco */
        #feedbackText {
            position: absolute;
            left: 50%;
            top: 40%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 0 0 12px #ff8800, 0 0 20px #ff5500;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.6s, transform 0.6s;
        }

        /* Animaciones */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
            20% { opacity: 1; transform: translate(-50%, -120%) scale(1.3); }
            80% { opacity: 1; transform: translate(-50%, -140%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -180%) scale(1); }
        }
        @keyframes glow {
            0% { box-shadow: 0 0 30px red; }
            50% { box-shadow: 0 0 70px #ff4444, 0 0 120px #ff0000; }
            100% { box-shadow: 0 0 30px red; }
        }

        /* Estilos de los dardos */
        .dart, #dart {
            position: absolute;
            width: 16px !important;
            height: 32px !important;
            transform-origin: bottom center;
            display: none;
        }

        .dart-fly {
            position: fixed !important;
            width: 32px !important;
            height: 64px !important;
            z-index: 1000;
            pointer-events: none;
            transform-origin: bottom center;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            animation: fly 1s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        @keyframes fly {
            0% { transform: translate(0, 0) rotate(0deg) scale(1.1); opacity: 1; }
            40% { transform: translate(0, -60px) rotate(0deg) scale(1.0); opacity: 1; }
            100% { transform: translate(0, 0) rotate(180deg) scale(0.7); opacity: 0.9; }
        }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="welcomeScreen">
        <div class="welcome-content">
            <img src="logo.jpg" class="game-logo" alt="Logo">
            <h1 class="title">IMPACTO PRECISO 🎯</h1>
            <p class="subtitle">Proyecto Universitario</p>
            <p>Materia: Formación de Emprendedores</p>
            <p class="welcome-text">
                Hola 👋 Bienvenido a nuestro proyecto universitario.<br>
                Pon a prueba tu precisión y compite en el ranking global.
            </p>
            <button onclick="enterGame()">Entrar al juego 🚀</button>
        </div>
    </div>

    <header>
        <h1>Impacto Preciso RD 🎯</h1>
    </header>

    <!-- Controles del jugador -->
    <input type="text" id="playerName" placeholder="Tu nombre">
    <select id="difficulty">
        <option value="easy">Fácil (15 seg)</option>
        <option value="medium" selected>Medio (10 seg)</option>
        <option value="hard">Difícil (7 seg)</option>
    </select>
    <button onclick="startGame()">Iniciar Juego</button>
    <button onclick="resetGame()">Reiniciar</button>

    <h2 id="timer">Tiempo: 10</h2>
    <h2 id="score">Puntos: 0</h2>

    <div class="game-container">
        <!-- Tablero del juego -->
        <div id="board" onclick="throwDart(event)">
            <!-- Aquí se clavarán los dardos -->
        </div>

        <!-- Ranking Global -->
        <div id="ranking">
            <h3>🏆 Ranking Global</h3>
            <div id="rankingList"></div>
        </div>
    </div>

    <!-- Mensaje flotante de puntos -->
    <div id="feedbackText"></div>

    <script>
        // ==================== CONFIGURACIÓN DE FIREBASE ====================
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "impacto-preciso.firebaseapp.com",
            projectId: "impacto-preciso",
            storageBucket: "impacto-preciso.appspot.com",
            messagingSenderId: "769895871874",
            appId: "1:769895871874:web:a964369999bdd42cc04b9b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==================== VARIABLES DEL JUEGO ====================
        let time = 10;                    // Tiempo restante
        let score = 0;                    // Puntos del jugador
        let difficultyMultiplier = 1;     // Multiplicador según dificultad
        let gameActive = false;           // ¿Está el juego en curso?
        let interval = null;              // Para controlar el temporizador
        let canThrow = true;              // Evita lanzar muchos dardos seguidos
        let currentPlayerName = "";       // Nombre del jugador actual

        // ==================== AL CARGAR LA PÁGINA ====================
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('lastPlayerName');
            if (saved) document.getElementById('playerName').value = saved;
        });

        // ==================== FUNCIONES DEL JUEGO ====================

        // Muestra el juego después de la pantalla de bienvenida
        function enterGame() {
            const welcome = document.getElementById("welcomeScreen");
            welcome.style.opacity = "0";
            setTimeout(() => {
                welcome.style.display = "none";
                document.querySelector("header").style.display = "block";
                document.querySelector(".game-container").style.display = "flex";
                document.getElementById("timer").style.display = "block";
                document.getElementById("score").style.display = "block";
            }, 800);
        }

        // Inicia el juego
        function startGame() {
            const name = document.getElementById("playerName").value.trim();
            if (name === "") {
                alert("Por favor escribe tu nombre");
                return;
            }

            localStorage.setItem('lastPlayerName', name);
            currentPlayerName = name;

            // Configurar dificultad
            const diff = document.getElementById("difficulty").value;
            if (diff === "easy") { time = 15; difficultyMultiplier = 1; }
            else if (diff === "medium") { time = 10; difficultyMultiplier = 1.5; }
            else { time = 7; difficultyMultiplier = 2; }

            score = 0;
            gameActive = true;

            document.getElementById("score").innerText = "Puntos: 0";
            document.getElementById("timer").innerText = "Tiempo: " + time;

            if (interval) clearInterval(interval);

            interval = setInterval(() => {
                time--;
                document.getElementById("timer").innerText = "Tiempo: " + time;

                if (time <= 0) {
                    clearInterval(interval);
                    gameActive = false;
                    alert("¡Juego terminado! Tu puntaje fue: " + score);
                    
                    // Borra los dardos al terminar
                    document.querySelectorAll('.dart').forEach(d => d.remove());
                    
                    if (currentPlayerName) saveScore(currentPlayerName, score);
                }
            }, 1000);
        }

        // Reinicia el juego completamente
        function resetGame() {
            clearInterval(interval);
            gameActive = false;
            time = 10;
            score = 0;
            document.getElementById("timer").innerText = "Tiempo: 10";
            document.getElementById("score").innerText = "Puntos: 0";
            document.querySelectorAll('.dart').forEach(d => d.remove());
        }

        // Función principal: Lanzar el dardo
        function throwDart(event) {
            if (!gameActive || !canThrow) return;

            canThrow = false;
            setTimeout(() => { canThrow = true; }, 300);

            const board = document.getElementById("board");
            const rect = board.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const distance = Math.sqrt((x - centerX)**2 + (y - centerY)**2);

            if (distance > 160) return; // Fuera del tablero

            // Calcular puntos según la distancia al centro
            let points = 0;
            if (distance < 30) points = 100;
            else if (distance < 60) points = 80;
            else if (distance < 90) points = 60;
            else if (distance < 120) points = 40;
            else if (distance < 150) points = 20;

            // Efecto visual si es bullseye
            if (points === 100) {
                board.classList.add("bullseye");
                setTimeout(() => board.classList.remove("bullseye"), 600);
            }

            const totalPoints = Math.floor(points * difficultyMultiplier);
            score += totalPoints;
            document.getElementById("score").innerText = "Puntos: " + score;

            // Animación del dardo volando
            createFlyingDart(x, y, rect, centerX, centerY, totalPoints);
        }

        // ==================== FUNCIONES AUXILIARES ====================

        function createFlyingDart(x, y, rect, centerX, centerY, totalPoints) {
            const hitX = rect.left + x;
            const hitY = rect.top + y;
            const startX = window.innerWidth / 2;
            const startY = window.innerHeight + 100;

            const flyDart = document.createElement('div');
            flyDart.className = 'dart-fly';
            flyDart.innerHTML = `<!-- SVG del dardo -->`; // (el SVG completo está en el código original)

            flyDart.style.left = startX + 'px';
            flyDart.style.top = startY + 'px';
            document.body.appendChild(flyDart);

            setTimeout(() => {
                const angleToCenter = Math.atan2(centerY - y, centerX - x) * 180 / Math.PI;
                flyDart.style.left = (hitX - 16) + 'px';
                flyDart.style.top = (hitY - 32) + 'px';
                flyDart.style.transform += ` rotate(${angleToCenter}deg)`;
            }, 10);

            // Después de la animación, clavamos el dardo en el tablero
            setTimeout(() => {
                flyDart.remove();

                const newStuckDart = document.createElement('div');
                newStuckDart.className = 'dart';
                newStuckDart.innerHTML = `<!-- SVG del dardo -->`;
                newStuckDart.style.left = x + 'px';
                newStuckDart.style.top = y + 'px';
                newStuckDart.style.transform = `rotate(${Math.atan2(centerY - y, centerX - x) * 180 / Math.PI}deg) scale(0.7)`;
                
                document.getElementById("board").appendChild(newStuckDart);

                // Máximo 4 dardos clavados
                const allStuck = document.querySelectorAll('.dart');
                if (allStuck.length > 4) allStuck[0].remove();

                // Mostrar puntos flotantes
                showFeedback(totalPoints);
            }, 800);
        }

        function showFeedback(points) {
            const feedback = document.getElementById("feedbackText");
            feedback.innerText = "+" + points + " pts!";
            feedback.style.opacity = "1";
            feedback.style.animation = "floatUp 1.4s ease-out forwards";

            // Sonido de impacto
            const audio = new Audio("https://cdn.freesound.org/previews/387/387232_7253554-lq.mp3");
            audio.volume = 0.5;
            audio.play().catch(() => {});

            setTimeout(() => {
                feedback.style.opacity = "0";
            }, 1400);
        }

        // Guardar puntaje en Firebase
        async function saveScore(nombre, puntosNuevos) {
            try {
                const q = db.collection("ranking").where("nombre", "==", nombre).limit(1);
                const querySnapshot = await q.get();

                if (!querySnapshot.empty) {
                    const doc = querySnapshot.docs[0];
                    const oldScore = doc.data().puntos || 0;
                    if (puntosNuevos > oldScore) {
                        await doc.ref.update({ 
                            puntos: puntosNuevos, 
                            fecha: firebase.firestore.FieldValue.serverTimestamp() 
                        });
                    }
                } else {
                    await db.collection("ranking").add({ 
                        nombre: nombre, 
                        puntos: puntosNuevos, 
                        fecha: firebase.firestore.FieldValue.serverTimestamp() 
                    });
                }
            } catch (err) {
                console.error("ERROR al guardar puntaje:", err);
            }
        }

        // Actualizar ranking en tiempo real
        db.collection("ranking").orderBy("puntos", "desc").limit(20).onSnapshot(snapshot => {
            let html = "";
            let position = 1;
            snapshot.forEach(doc => {
                const data = doc.data();
                let medal = position === 1 ? "🥇" : position === 2 ? "🥈" : position === 3 ? "🥉" : "";
                const className = position === 1 ? ' class="top1"' : '';
                html += `<p${className}>${medal} ${data.nombre} - ${data.puntos} pts</p>`;
                position++;
            });
            document.getElementById("rankingList").innerHTML = html || "<p>Aún no hay puntajes</p>";
        });
    </script>
</body>
</html>
